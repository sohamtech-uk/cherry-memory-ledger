[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cherry-memory-ledger"
version = "0.1.0"
description = "Hackathon prototype for load-bearing accounting memory across fresh agent sessions"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Sohamtech UK contributors"}
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "sibyl-memory-client>=0.4.4,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "uvicorn>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cherry_memory_ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.vercel]
entrypoint = "app:app"
